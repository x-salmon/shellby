<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>5 · One key, then "All keys": only the global hotkey shows; the rest open on request (wide shows it open)</title>
<link rel="stylesheet" href="shared.css">
<style>
  .one { margin-top: 22px; display: flex; justify-content: center; align-items: center; gap: 10px; font-size: 12.5px; color: var(--sand-faint); position: relative; }
  .one > span kbd { color: var(--glass); border-color: rgba(127,214,194,.35); font-size: 11.5px; }
  .one button { font: inherit; color: var(--sand-dim); background: none; border: 0; text-decoration: underline dotted; text-underline-offset: 3px; }
  .one button:hover { color: var(--glass); }
  .sheet { display: none; position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%); width: 340px; text-align: left;
    background: var(--reef-2); border: 1px solid var(--reef-3); border-radius: var(--r-lg); padding: 14px 16px 12px; box-shadow: 0 18px 40px rgb(0 0 0 / .45); }
  .wide .sheet { display: block; }
  .sheet h2 { font: 600 14px var(--font-pixel); margin-bottom: 10px; }
  .sheet dl { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; font-size: 13px; color: var(--sand-dim); }
  .sheet dd { text-align: right; }
  .sheet .foot { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12px; color: var(--sand-faint); }
  .sheet .foot a { color: var(--glass); text-decoration: none; }
  .wide .sugs { opacity: .35; }
</style>
</head>
<body>
<template id="hint">
  <div class="one">
    <span><kbd>Ctrl Alt Space</kbd> opens me from anywhere</span>
    <button type="button" aria-expanded="false">All keys</button>
    <div class="sheet" role="dialog" aria-label="Keys">
      <h2>Keys</h2>
      <dl>
        <dt>Run a skill</dt><dd><kbd>/</kbd></dd>
        <dt>Jump to any screen</dt><dd><kbd>Ctrl K</kbd></dd>
        <dt>Switch mode</dt><dd><kbd>Shift Tab</kbd></dd>
        <dt>Attach a file</dt><dd>Drop it or <kbd>Ctrl V</kbd></dd>
        <dt>Open Shellby</dt><dd><kbd>Ctrl Alt Space</kbd></dd>
      </dl>
      <p class="foot">Change any of these in <a href="#">Settings › Keys</a></p>
    </div>
  </div>
</template>
<script src="shared.js"></script>
</body>
</html>

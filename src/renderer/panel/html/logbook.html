  <!-- ====================== LOGBOOK ====================== -->
  <!-- every game system on one page, each card linked to its screen (logbook.js, main/logbook.js) -->
  <main class="view view-logbook" id="logbookView">
    <div class="view-head">
      <h2 class="sr-only">Logbook</h2>
      <!-- @include shellby-tabs.html -->
    </div>
    <p class="muted small lb-intro">What’s going on, what to do next, and what each thing leads to. Every card opens its screen.</p>
    <p class="view-lede newcomer-only" id="lbNewcomer">Just starting? First steps on the chat’s start screen come first. This page fills up as you two work.</p>
    <div class="lb-cards" id="lbCards" aria-live="polite"></div>
    <section class="lb-chapters" id="lbChapters" aria-labelledby="lbChaptersHead" tabindex="-1">
      <h3 id="lbChaptersHead">Quest line <span class="muted small" id="lbChapterCount"></span></h3>
      <ol class="lb-chapter-list" id="lbChapterList"></ol>
    </section>
  </main>
